name: Keep Render awake

on:
  schedule:
    # every 10 minutes — Render's free tier sleeps after 15 minutes idle
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the admin server
        run: curl -sf https://sklad-admin.onrender.com/manage/ -o /dev/null -w "HTTP %{http_code}\n"
