<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Склад — простой кабинет</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #1f6feb;
    --danger: #c62828;
    --border: #e5e5e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 20px; }
  header button {
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-main-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .header-main-actions .add-btn {
    padding: 8px 14px;
    font-size: 13px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
  }
  .lang-switch button {
    padding: 6px 12px;
    font-size: 13px;
  }
  .lang-switch button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .stat-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .stat-icon { font-size: 16px; }
  .stat-value { font-size: 16px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-card.warn .stat-value { color: #b45309; }
  #countLabel a { color: var(--accent); }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  /* --- Login screen --- */
  .login-box {
    max-width: 340px;
    margin: 80px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }
  .login-box h2 { margin-top: 0; }
  .login-box input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    margin: 12px 0;
  }
  .login-box button, .primary-btn {
    width: 100%;
    padding: 10px 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }

  /* --- Product list --- */
  .count-label {
    color: var(--muted);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 8px;
  }
  .add-btn {
    padding: 10px 18px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .add-btn.outline {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .add-btn.small {
    padding: 6px 12px;
    font-size: 13px;
  }
  .secondary-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .hint.inline {
    margin: 0;
    flex-basis: 100%;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th { background: #fafaf8; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .badge.on { background: #e3f5e6; color: #1a7f37; }
  .badge.off { background: #f0f0ee; color: var(--muted); }
  .badge.new { background: #fff2cc; color: #8a6d00; }
  .row-actions button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    margin-right: 8px;
  }
  .row-actions button.del { color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px;
  }

  /* --- Modal form --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 30;
  }
  .modal {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field textarea.paste-area {
    min-height: 130px;
    font-size: 14px;
    border: 2px dashed var(--accent);
    background: #f4f8ff;
  }
  .photo-preview {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .photo-preview img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .more-toggle {
    width: 100%;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    text-align: left;
    padding: 4px 0 14px;
    cursor: pointer;
  }
  .field.checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field.checkbox input { width: auto; }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 14px;
  }
  .modal-actions button.save {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: -8px;
    margin-bottom: 12px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    z-index: 40;
  }
  .folder-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .folder-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff8ea;
    border: 1px solid #f0c36d;
    color: #8a6d00;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .folder-icon { font-size: 14px; }
  .folder-tab.active {
    background: #b45309;
    border-color: #b45309;
    color: #fff;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chips button {
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .chips button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chips button.issue {
    border-color: #f0c36d;
    background: #fff8ea;
    color: #8a6d00;
  }
  .chips button.issue.active {
    background: #b45309;
    border-color: #b45309;
    color: #fff;
  }
  .bulk-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #eef4ff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .bulk-btn {
    border: 1px solid var(--border);
    background: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .bulk-btn.publish {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .bulk-btn.del {
    background: #fff;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .bulk-btn.link {
    border: none;
    background: none;
    color: var(--muted);
    margin-left: auto;
  }
  .row-check { width: 18px; }
  .select-all { display: flex; align-items: center; gap: 8px; }
  .select-all span { display: none; font-weight: 500; color: var(--muted); }
  .cat-line { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .category-filter {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    min-width: 220px;
    margin-bottom: 12px;
  }

  /* --- Categories window --- */
  .category-add {
    display: flex;
    flex-direction: column;
    background: #fafaf8;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px;
    margin-bottom: 14px;
  }
  .category-add .field { margin-bottom: 10px; }
  .category-tree { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .category-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .category-row:last-child { border-bottom: none; }
  .category-row.sub { padding-left: 28px; background: #fafaf8; }
  .category-row.sub .category-name::before { content: '› '; color: var(--muted); }
  .category-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .category-row.main .category-name { font-weight: 600; }
  .category-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .icon-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 15px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: #f0f0ee; }
  .category-tree .empty { padding: 20px; font-size: 14px; }
  .hidden { display: none !important; }

  /* --- Phone screens --- */
  @media (max-width: 640px) {
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 18px; flex: 1; }
    header button { padding: 8px 12px; }
    .header-right { gap: 6px; }
    .header-main-actions { order: 2; flex-basis: 100%; gap: 6px; }
    .header-main-actions .add-btn { flex: 1 1 auto; padding: 10px 8px; }
    .container { padding: 12px; }

    .login-box { margin: 32px 16px; padding: 24px 18px; }
    .login-box input, .field input, .field textarea, .field select, .category-filter { font-size: 16px; }

    .stats { gap: 6px; }
    .stat-card { flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px 12px; padding: 0 12px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex-shrink: 0; padding: 7px 12px; }
    .category-filter { width: 100%; min-width: 0; }
    .secondary-actions .add-btn.small { flex: 1 1 auto; padding: 9px 10px; }

    /* product table turns into one card per product */
    table, thead, tbody, tr, td { display: block; }
    thead tr { display: block; padding: 10px 12px; background: #fafaf8; border-bottom: 1px solid var(--border); }
    thead th { display: none; padding: 0; border: none; background: none; }
    thead th.row-check { display: block; width: auto; }
    .select-all span { display: inline; }
    tbody tr {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      grid-template-areas:
        "check name name"
        ".     price stock"
        ".     status actions";
      gap: 6px 8px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 0; border: none; }
    td.row-check { grid-area: check; width: auto; align-self: start; padding-top: 2px; }
    td.c-name { grid-area: name; font-weight: 600; overflow-wrap: anywhere; }
    td.c-name .cat-line { font-weight: 400; }
    td.c-price { grid-area: price; font-weight: 600; }
    td.c-stock { grid-area: stock; text-align: right; color: var(--muted); }
    td.c-status { grid-area: status; }
    td.c-actions { grid-area: actions; text-align: right; white-space: nowrap; }
    .row-actions button { padding: 6px 4px; margin: 0 0 0 8px; font-size: 14px; }
    input[type="checkbox"] { width: 18px; height: 18px; }

    .bulk-bar {
      position: sticky;
      bottom: 8px;
      z-index: 5;
      flex-wrap: wrap;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .bulk-bar #bulkCount { flex-basis: 100%; font-weight: 600; }
    .bulk-btn { padding: 9px 12px; }
    .bulk-btn.link { margin-left: 0; }

    .overlay { padding: 8px; align-items: flex-end; }
    .modal { padding: 18px 16px; max-height: 92vh; max-height: 92dvh; border-radius: 14px; }
    .two-col { grid-template-columns: 1fr; gap: 0; }
    .modal-actions button { padding: 12px; }
    .toast { max-width: calc(100vw - 32px); text-align: center; bottom: 16px; }
  }

  /* ======== Новое оформление кабинета ======== */
  :root { --bg: #f6f4ef; --text: #25282b; --muted: #7a7d80; --accent: #b3261e; --border: #e6e1d6; --ok: #1a7f37; --warn: #b45309; }
  body { background: var(--bg); }
  header { position: sticky; top: 0; z-index: 30; padding: 12px 24px; box-shadow: 0 1px 0 var(--border); }
  header h1 { font-size: 19px; letter-spacing: .01em; }
  header h1::before { content: '🏬 '; }
  .add-btn { background: var(--accent); }
  .add-btn.outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .legacy { display: none !important; }
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; max-width: 1500px; margin: 0 auto; padding: 22px 24px 60px; align-items: start; }
  .sidebar { position: sticky; top: 74px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px 10px 16px; max-height: calc(100vh - 92px); overflow-y: auto; }
  .sb-title { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 12px 12px 6px; }
  .sb-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 10px; font-size: 14.5px; color: var(--text); cursor: pointer; text-align: left; }
  .sb-item:hover { background: #f4efe6; }
  .sb-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .sb-item .n { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f0ebe0; color: var(--muted); flex-shrink: 0; }
  .sb-item.active .n { background: rgba(255,255,255,.25); color: #fff; }
  .sb-item.warn .n { background: #fdecea; color: var(--accent); }
  .sb-item.sub { padding-left: 30px; font-size: 13.5px; color: #55595c; }
  .sb-item.sub.active { color: #fff; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap .search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .55; font-size: 14px; }
  .search-wrap input { width: 100%; padding: 12px 14px 12px 38px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: #fff; color: var(--text); }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #fdecea; }
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
  .view-toggle button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-size: 16px; color: var(--muted); }
  .view-toggle button.active { background: var(--accent); color: #fff; }
  .tb-btn { display: none; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 11px 14px; font-weight: 600; cursor: pointer; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
  .pcard { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
  .pcard:hover { box-shadow: 0 8px 22px rgba(60,40,20,.10); transform: translateY(-2px); }
  .pcard.sel { outline: 2px solid var(--accent); }
  .pimg { position: relative; aspect-ratio: 1 / 1; background: #f1ede4; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pimg .nophoto { text-align: center; color: #b3261e; font-size: 13px; font-weight: 600; }
  .pimg .nophoto b { display: block; font-size: 34px; opacity: .5; margin-bottom: 4px; }
  .pchk { position: absolute; top: 10px; left: 10px; z-index: 2; width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .pbadges { position: absolute; top: 9px; right: 9px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .pb { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
  .pb.new { background: #d97706; } .pb.on { background: var(--ok); } .pb.off { background: #8a8d90; }
  .pbody { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .psku { font-weight: 700; font-size: 15px; }
  .pname { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .pprice { font-size: 17px; font-weight: 800; color: var(--accent); }
  .pprice.none { font-size: 13px; font-weight: 700; color: #fff; background: var(--accent); display: inline-block; padding: 3px 9px; border-radius: 8px; align-self: flex-start; }
  .pmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
  .pmeta .stk { font-weight: 700; color: var(--ok); } .pmeta .stk.low { color: var(--warn); } .pmeta .stk.zero { color: var(--accent); }
  .pcat { font-size: 12px; color: #55595c; background: #f4efe6; border-radius: 8px; padding: 3px 8px; align-self: flex-start; }
  .pact { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
  .pact button { flex: 1; border: 1px solid var(--border); background: #fff; border-radius: 9px; padding: 8px 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .pact button:hover { border-color: var(--accent); color: var(--accent); }
  .pact .pub { background: var(--ok); color: #fff; border-color: var(--ok); } .pact .pub:hover { color: #fff; filter: brightness(1.06); }
  .pact .del { flex: 0 0 38px; color: var(--accent); }
  .pgrid.list { grid-template-columns: 1fr; gap: 8px; }
  .pgrid.list .pcard { flex-direction: row; align-items: center; }
  .pgrid.list .pimg { width: 84px; height: 84px; aspect-ratio: auto; flex-shrink: 0; }
  .pgrid.list .pimg .nophoto b { font-size: 24px; margin: 0; } .pgrid.list .pimg .nophoto span { display: none; }
  .pgrid.list .pchk { top: 6px; left: 6px; width: 17px; height: 17px; }
  .pgrid.list .pbadges { display: none; }
  .pgrid.list .pbody { flex-direction: row; align-items: center; gap: 18px; padding: 8px 14px; flex-wrap: wrap; }
  .pgrid.list .pname { min-height: 0; -webkit-line-clamp: 1; flex: 1 1 200px; font-size: 13.5px; }
  .pgrid.list .psku { min-width: 110px; }
  .pgrid.list .pact { margin: 0; padding: 0; min-width: 230px; }
  .sb-backdrop { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 12px 12px 90px; gap: 12px; }
    .sidebar { display: none; position: fixed; inset: 0 22% 0 0; top: 0; z-index: 60; max-height: none; border-radius: 0 16px 16px 0; padding-top: 18px; }
    body.sb-open .sidebar { display: block; }
    body.sb-open .sb-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; }
    .tb-btn { display: block; }
    .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    header { padding: 10px 12px; }
    .pgrid.list .pbody { gap: 4px 10px; } .pgrid.list .pact { min-width: 100%; }
    .view-toggle button { padding: 10px 11px; }
  }

  /* ---- top navigation instead of the left panel ---- */
  .layout { display: block !important; max-width: 1240px; padding: 18px 24px 60px; }
  .sidebar { position: static !important; display: block !important; background: none !important; border: 0 !important; padding: 0 !important; max-height: none !important; overflow: visible !important; margin-bottom: 16px; inset: auto !important; }
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tab { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 16px; color: var(--text); text-align: left; transition: box-shadow .15s; }
  .tab:hover { box-shadow: 0 6px 16px rgba(60,40,20,.10); }
  .tab .ico { font-size: 26px; }
  .tab .tl { display: block; font-weight: 700; }
  .tab small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .tab .tn { margin-left: auto; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #f0ebe0; color: var(--muted); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 8px 18px rgba(179,38,30,.28); }
  .tab.active small { color: rgba(255,255,255,.85); }
  .tab.active .tn { background: rgba(255,255,255,.25); color: #fff; }
  .tab.warn:not(.active) { border-color: #f0c4bf; background: #fff7f6; }
  .tab.warn:not(.active) .tn { background: var(--accent); color: #fff; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pills.sub { margin-top: 8px; padding-left: 4px; }
  .pill { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 15px; font-size: 14px; cursor: pointer; color: var(--text); }
  .pill b { font-weight: 700; color: var(--muted); margin-left: 7px; font-size: 12.5px; }
  .pill:hover { border-color: var(--accent); }
  .pill.active { background: var(--text); color: #fff; border-color: var(--text); }
  .pill.active b { color: rgba(255,255,255,.75); }
  .pills.sub .pill { font-size: 13px; padding: 6px 12px; }
  .tb-btn { display: none !important; }
  @media (max-width: 900px) {
    .layout { padding: 12px 12px 90px; }
    .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tab { padding: 12px; gap: 8px; } .tab small { display: none; } .tab .ico { font-size: 20px; } .tab { font-size: 14px; }
    .pills { flex-wrap: nowrap; overflow-x: auto; margin-left: -12px; margin-right: -12px; padding: 0 12px 4px; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; } .pill { flex-shrink: 0; }
  }
  .more-actions { margin: 4px 0 14px; }
  .more-actions summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 2px; list-style: none; }
  .more-actions summary:hover { color: var(--accent); }
  .more-actions[open] summary { margin-bottom: 8px; }
  #syncNewOnlyBtn { font-size: 15px; padding: 11px 20px; }
  #addBtn { font-size: 15px; padding: 11px 20px; }
</style>
</head>
<body>

<div class="sb-backdrop" id="sbBackdrop"></div>
<div id="loginScreen" class="login-box">
  <div class="lang-switch" id="langSwitchLogin" style="justify-content:center; margin-bottom:12px;">
    <button data-lang="ru">RU</button>
    <button data-lang="kz">ҚАЗ</button>
  </div>
  <h2>Склад</h2>
  <p id="loginSubtitle" style="color: var(--muted); font-size: 14px;"></p>
  <input type="password" id="passwordInput" />
  <button id="loginBtn"></button>
  <div class="login-error" id="loginError"></div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1>Склад</h1>
    <div class="header-main-actions">
      <button class="add-btn" id="syncNewOnlyBtn"></button>
      <button class="add-btn" id="addBtn"></button>
      <button class="add-btn outline" id="categoriesBtn"></button>
    </div>
    <div class="header-right">
      <button id="pricingBtn">⚙️</button>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ru">RU</button>
        <button data-lang="kz">ҚАЗ</button>
      </div>
      <button id="logoutBtn"></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="legacy">
        <div class="stats" id="stats"></div>
        <div class="folder-tabs" id="folderTabs"></div>
        <div class="chips" id="chips"></div>
        <select id="categoryFilter" class="category-filter"></select>
      </div>

      <div class="toolbar">
        <button type="button" class="tb-btn" id="sidebarToggle"></button>
        <div class="search-wrap"><span class="search-ico">🔍</span><input type="search" id="searchInput" autocomplete="off" /></div>
        <div class="view-toggle" id="viewToggle">
          <button type="button" data-view="grid" title="Плитки">▦</button>
          <button type="button" data-view="list" title="Список">☰</button>
        </div>
      </div>
      <div id="countLabel" class="count-label"></div>

      <details class="more-actions"><summary>⋯ Ещё: МойСклад, загрузка файла</summary>
      <div class="secondary-actions">
        <button class="add-btn outline small" id="syncMoyskladBtn"></button>
        <button class="add-btn outline small" id="importFileBtn"></button>
        <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv,.zip" class="hidden" />
        <span class="hint inline" id="importFileHint"></span>
      </div></details>

      <div class="bulk-bar hidden" id="bulkBar">
        <span id="bulkCount"></span>
        <button id="bulkPublishBtn" class="bulk-btn publish"></button>
        <button id="bulkUnpublishBtn" class="bulk-btn"></button>
        <button id="bulkCategoryBtn" class="bulk-btn"></button>
        <button id="bulkFindPricesBtn" class="bulk-btn"></button>
        <button id="bulkDeleteBtn" class="bulk-btn del"></button>
        <button id="bulkDeselectBtn" class="bulk-btn link"></button>
      </div>

      <div id="tableWrap"></div>
    </main>
  </div>
</div>

<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <form id="productForm">
      <div class="field">
        <label id="l_paste"></label>
        <textarea id="f_description" class="paste-area" rows="6"></textarea>
        <div class="hint" id="pasteHint"></div>
      </div>
      <div class="field">
        <label id="l_name"></label>
        <input type="text" id="f_name" required />
      </div>
      <div class="field">
        <label id="l_photo"></label>
        <input type="file" id="f_photo" accept="image/*" multiple />
        <div class="hint" id="photoHint"></div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="button" class="more-toggle" id="moreToggle"></button>

      <div id="moreFields" class="hidden">
        <div class="field">
          <label id="l_category" for="f_category"></label>
          <select id="f_category"></select>
          <div class="hint" id="categoryHint" style="margin:4px 0 0;"></div>
        </div>
        <div class="two-col">
          <div class="field">
            <label id="l_sku"></label>
            <input type="text" id="f_sku" />
          </div>
          <div class="field">
            <label id="l_stock"></label>
            <input type="number" id="f_stock" value="0" />
          </div>
        </div>
        <div class="two-col">
          <div class="field">
            <label id="l_price"></label>
            <input type="number" id="f_price" step="0.01" value="0" />
          </div>
          <div class="field">
            <label id="l_minqty"></label>
            <input type="number" id="f_minqty" value="1" />
          </div>
        </div>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="f_published" />
        <label for="f_published" id="l_published" style="margin-bottom:0;"></label>
      </div>
      <div class="field checkbox">
        <input type="checkbox" id="f_isNew" />
        <label for="f_isNew" id="l_isNew" style="margin-bottom:0;"></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn"></button>
        <button type="submit" class="save" id="saveBtn"></button>
      </div>
    </form>
  </div>
</div>

<div id="pricingOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="pricingTitle"></h3>
    <p class="hint" id="pricingHint" style="margin-top:0;"></p>

    <div class="two-col">
      <div class="field">
        <label id="l_markup"></label>
        <input type="number" id="f_markup" step="1" />
      </div>
      <div class="field">
        <label id="l_roundTo"></label>
        <input type="number" id="f_roundTo" step="1" />
      </div>
    </div>

    <p class="hint" id="pricingFormula" style="margin-top:0;"></p>
    <p class="hint" id="pricingCoverage" style="margin-top:0;"></p>

    <div class="field checkbox">
      <input type="checkbox" id="f_forceApply" />
      <label for="f_forceApply" id="l_forceApply" style="margin-bottom:0;"></label>
    </div>

    <div class="modal-actions">
      <button type="button" id="pricingCancelBtn"></button>
      <button type="button" class="save" id="pricingSaveBtn"></button>
    </div>
    <div class="modal-actions">
      <button type="button" class="save" id="pricingApplyBtn" style="width:100%; background:#1a7f37;"></button>
    </div>
  </div>
</div>

<div id="categoriesOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="categoriesTitle"></h3>
    <p class="hint" id="categoriesHint" style="margin-top:0;"></p>

    <div class="category-add">
      <div class="field">
        <label id="l_newCategory" for="f_newCategoryName"></label>
        <input type="text" id="f_newCategoryName" maxlength="60" />
      </div>
      <div class="field">
        <label id="l_newCategoryParent" for="f_newCategoryParent"></label>
        <select id="f_newCategoryParent"></select>
      </div>
      <button type="button" class="add-btn" id="addCategoryBtn"></button>
    </div>

    <div class="category-tree" id="categoryTree"></div>

    <div class="modal-actions">
      <button type="button" id="categoriesCloseBtn"></button>
    </div>
  </div>
</div>

<div id="moveOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="moveTitle"></h3>
    <div class="field">
      <select id="f_moveCategory" aria-label="Категория"></select>
    </div>
    <div class="modal-actions">
      <button type="button" id="moveCancelBtn"></button>
      <button type="button" class="save" id="moveSaveBtn"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/manage/app.js"></script>
</body>
</html>
