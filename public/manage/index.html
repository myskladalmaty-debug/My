<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Склад — простой кабинет</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #1f6feb;
    --danger: #c62828;
    --border: #e5e5e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 20px; }
  header button {
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
  }
  .lang-switch button {
    padding: 6px 12px;
    font-size: 13px;
  }
  .lang-switch button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .stat-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .stat-icon { font-size: 22px; }
  .stat-value { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-card.warn .stat-value { color: #b45309; }
  #countLabel a { color: var(--accent); }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  /* --- Login screen --- */
  .login-box {
    max-width: 340px;
    margin: 80px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }
  .login-box h2 { margin-top: 0; }
  .login-box input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    margin: 12px 0;
  }
  .login-box button, .primary-btn {
    width: 100%;
    padding: 10px 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }

  /* --- Product list --- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .add-btn {
    padding: 10px 18px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th { background: #fafaf8; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .badge.on { background: #e3f5e6; color: #1a7f37; }
  .badge.off { background: #f0f0ee; color: var(--muted); }
  .row-actions button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    margin-right: 8px;
  }
  .row-actions button.del { color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px;
  }

  /* --- Modal form --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field textarea.paste-area {
    min-height: 130px;
    font-size: 14px;
    border: 2px dashed var(--accent);
    background: #f4f8ff;
  }
  .photo-preview {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .photo-preview img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .more-toggle {
    width: 100%;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    text-align: left;
    padding: 4px 0 14px;
    cursor: pointer;
  }
  .field.checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field.checkbox input { width: auto; }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 14px;
  }
  .modal-actions button.save {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: -8px;
    margin-bottom: 12px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chips button {
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .chips button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .bulk-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #eef4ff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .bulk-btn {
    border: 1px solid var(--border);
    background: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .bulk-btn.publish {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .bulk-btn.link {
    border: none;
    background: none;
    color: var(--muted);
    margin-left: auto;
  }
  .row-check { width: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <div class="lang-switch" id="langSwitchLogin" style="justify-content:center; margin-bottom:12px;">
    <button data-lang="ru">RU</button>
    <button data-lang="kz">ҚАЗ</button>
  </div>
  <h2>Склад</h2>
  <p id="loginSubtitle" style="color: var(--muted); font-size: 14px;"></p>
  <input type="password" id="passwordInput" />
  <button id="loginBtn"></button>
  <div class="login-error" id="loginError"></div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1>Склад</h1>
    <div class="header-right">
      <button id="pricingBtn">⚙️</button>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ru">RU</button>
        <button data-lang="kz">ҚАЗ</button>
      </div>
      <button id="logoutBtn"></button>
    </div>
  </header>

  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>

    <div class="toolbar">
      <div id="countLabel" style="color: var(--muted); font-size: 14px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="add-btn" id="importFileBtn" style="background:#fff; color:var(--accent); border:1px solid var(--accent);"></button>
        <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv,.zip" class="hidden" />
        <button class="add-btn" id="addBtn"></button>
      </div>
    </div>
    <div class="hint" id="importFileHint" style="margin-top:-10px;"></div>

    <div class="bulk-bar hidden" id="bulkBar">
      <span id="bulkCount"></span>
      <button id="bulkPublishBtn" class="bulk-btn publish"></button>
      <button id="bulkUnpublishBtn" class="bulk-btn"></button>
      <button id="bulkDeselectBtn" class="bulk-btn link"></button>
    </div>

    <div id="tableWrap"></div>
  </div>
</div>

<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <form id="productForm">
      <div class="field">
        <label id="l_paste"></label>
        <textarea id="f_description" class="paste-area" rows="6"></textarea>
        <div class="hint" id="pasteHint"></div>
      </div>
      <div class="field">
        <label id="l_name"></label>
        <input type="text" id="f_name" required />
      </div>
      <div class="field">
        <label id="l_photo"></label>
        <input type="file" id="f_photo" accept="image/*" multiple />
        <div class="hint" id="photoHint"></div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="button" class="more-toggle" id="moreToggle"></button>

      <div id="moreFields" class="hidden">
        <div class="two-col">
          <div class="field">
            <label id="l_sku"></label>
            <input type="text" id="f_sku" />
          </div>
          <div class="field">
            <label id="l_category"></label>
            <input type="text" id="f_category" />
          </div>
        </div>
        <div class="two-col">
          <div class="field">
            <label id="l_price"></label>
            <input type="number" id="f_price" step="0.01" value="0" />
          </div>
          <div class="field">
            <label id="l_minqty"></label>
            <input type="number" id="f_minqty" value="1" />
          </div>
        </div>
        <div class="field">
          <label id="l_stock"></label>
          <input type="number" id="f_stock" value="0" />
        </div>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="f_published" />
        <label for="f_published" id="l_published" style="margin-bottom:0;"></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn"></button>
        <button type="submit" class="save" id="saveBtn"></button>
      </div>
    </form>
  </div>
</div>

<div id="pricingOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="pricingTitle"></h3>
    <p class="hint" id="pricingHint" style="margin-top:0;"></p>

    <div class="two-col">
      <div class="field">
        <label id="l_markup"></label>
        <input type="number" id="f_markup" step="1" />
      </div>
      <div class="field">
        <label id="l_roundTo"></label>
        <input type="number" id="f_roundTo" step="1" />
      </div>
    </div>

    <p class="hint" id="pricingFormula" style="margin-top:0;"></p>
    <p class="hint" id="pricingCoverage" style="margin-top:0;"></p>

    <div class="field checkbox">
      <input type="checkbox" id="f_forceApply" />
      <label for="f_forceApply" id="l_forceApply" style="margin-bottom:0;"></label>
    </div>

    <div class="modal-actions">
      <button type="button" id="pricingCancelBtn"></button>
      <button type="button" class="save" id="pricingSaveBtn"></button>
    </div>
    <div class="modal-actions">
      <button type="button" class="save" id="pricingApplyBtn" style="width:100%; background:#1a7f37;"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
