<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Каталог товаров — оптом</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card-bg: #ffffff;
    --text: #1c1b18;
    --muted: #75726a;
    --accent: #b4551f;
    --accent-dark: #8f4218;
    --accent-soft: #fbeee3;
    --border: #e8e4da;
    --success: #1a7f37;
    --success-soft: #e6f4ea;
    --danger: #b3261e;
    --danger-soft: #fbeaea;
    --new: #b4551f;
    --shadow: 0 1px 2px rgba(28, 27, 24, 0.04), 0 8px 24px rgba(28, 27, 24, 0.06);
    --shadow-hover: 0 4px 10px rgba(28, 27, 24, 0.06), 0 16px 32px rgba(28, 27, 24, 0.10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f;
      --card-bg: #211e17;
      --text: #f2efe8;
      --muted: #a39c8c;
      --accent: #e08a4f;
      --accent-dark: #f0a670;
      --accent-soft: #3a2617;
      --border: #363026;
      --success: #4fbf6d;
      --success-soft: #1c3323;
      --danger: #e6675f;
      --danger-soft: #3a2020;
      --new: #e08a4f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 4px 10px rgba(0, 0, 0, 0.25), 0 16px 32px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: saturate(180%) blur(10px);
  }
  header .header-row {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-mark {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 10px rgba(180, 85, 31, 0.28);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  header p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.3;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .lang-switch button.active {
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  /* ---------- Layout ---------- */
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ---------- Search ---------- */
  .search {
    margin-bottom: 16px;
    position: relative;
  }
  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ---------- Category pills ---------- */
  .categories {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .categories button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
  }
  .categories button:hover {
    border-color: var(--accent);
  }
  .categories button:active {
    transform: scale(0.97);
  }
  .categories button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .result-count {
    font-size: 13px;
    color: var(--muted);
    margin: -8px 0 16px;
  }

  /* ---------- Product grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }
  .card-image {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(155deg, var(--bg), var(--border));
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.35s ease;
  }
  .card:hover .card-image img {
    transform: scale(1.05);
  }
  .card-image .no-photo {
    font-size: 34px;
    opacity: 0.35;
  }
  .card-body {
    padding: 13px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card-body h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .price {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }
  .desc {
    font-size: 12.5px;
    color: var(--muted);
    flex: 1;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-line;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .minqty {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .stock {
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .stock .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .stock.in { color: var(--success); }
  .stock.in .dot { background: var(--success); }
  .stock.out { color: var(--danger); }
  .stock.out .dot { background: var(--danger); }

  .badge-new {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--new);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 1;
    box-shadow: 0 2px 6px rgba(180, 85, 31, 0.4);
  }

  /* ---------- Empty / loading states ---------- */
  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 70px 20px;
    font-size: 14px;
  }
  .empty::before, .loading::before {
    content: '';
    display: block;
    margin: 0 auto 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
  }
  .loading::before {
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  .empty::before {
    content: '🔍';
    font-size: 30px;
    line-height: 34px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .load-more {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 28px auto 0;
    padding: 12px 28px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .load-more:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .load-more:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* ---------- How to buy ---------- */
  .howtobuy {
    margin-top: 48px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px;
    box-shadow: var(--shadow);
  }
  .howtobuy h2 {
    margin: 0 0 18px;
    font-size: 19px;
    letter-spacing: -0.01em;
  }
  .howtobuy ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .howtobuy li {
    position: relative;
    padding: 18px 16px 16px 16px;
    background: var(--bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    counter-increment: step;
  }
  .howtobuy ul { counter-reset: step; }
  .howtobuy li::before {
    content: counter(step);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .contacts {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  .contacts a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  .contacts a:hover { background: var(--accent-dark); }
  .contacts a:active { transform: scale(0.97); }
  .contacts a::before {
    font-size: 15px;
    line-height: 1;
  }
  .contacts a.whatsapp::before { content: '💬'; }
  .contacts a.telegram::before { content: '✈️'; }
  .contacts a.phone::before { content: '📞'; }
  .contacts a.placeholder {
    background: var(--muted);
    opacity: 0.85;
  }
  .contacts a.placeholder:hover { background: var(--muted); opacity: 1; }

  footer.site-footer {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 28px 20px 36px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 560px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 18px; }
    .container { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .howtobuy { padding: 20px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">📦</div>
      <div>
        <h1 id="pageTitle"></h1>
        <p id="pageSubtitle"></p>
      </div>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="ru">RU</button>
      <button data-lang="kz">ҚАЗ</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" />
  </div>
  <div class="categories" id="categories"></div>
  <div class="result-count" id="resultCount"></div>
  <div id="content" class="loading"></div>
  <button class="load-more" id="loadMore" style="display:none;"></button>

  <div class="howtobuy">
    <h2 id="howToBuyTitle"></h2>
    <ul id="howToBuySteps"></ul>

    <!--
      TODO: замените плейсхолдеры ниже на реальные контакты, когда будут готовы.
      WhatsApp: ссылка вида https://wa.me/79991234567
      Telegram: ссылка вида https://t.me/username
      Телефон: ссылка вида tel:+79991234567
    -->
    <div class="contacts" id="contacts"></div>
  </div>

  <footer class="site-footer">Склад — оптовая продажа</footer>
</div>

<script src="/catalog/app.js"></script>

</body>
</html>
